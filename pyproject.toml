[project]
name = "verified-sandbox"
version = "0.1.0"
description = "Containerised beads worker loop, shared across repos instead of copy-pasted into them."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sandbox = "verified_sandbox:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verified_sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# This repo drives itself with its own loop.
[tool.sandbox]
